<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>トレカキングダム｜店頭販売カード</title>
</head>
<body>
  <script>
    (async () => {
      try {
        const response = await fetch("base-stable.html?v=20260819-1900", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let html = await response.text();
        html = html.replace(
          "</head>",
          '<link rel="stylesheet" href="hide-zero-stock.css?v=20260819-1900"><link rel="stylesheet" href="remaining-one.css?v=20260819-1900"></head>'
        );
        html = html.replace(
          "</body>",
          '<script src="remaining-one.js?v=20260819-1900"><\/script><script src="fixed-layout.js?v=20260819-1900"><\/script></body>'
        );
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.textContent = "表示データの読み込みに失敗しました。ページを再読み込みしてください。";
        console.error(error);
      }
    })();
  </script>
</body>
</html>
