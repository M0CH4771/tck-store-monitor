<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>トレカキングダム｜店頭販売カード</title>
</head>
<body>
  <script>
    (async () => {
      try {
        const VERSION = "20260821-2000";
        const response = await fetch(`base-stable.html?v=${VERSION}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        let html = await response.text();

        const replaceRequired = (search, replacement, label) => {
          if (!html.includes(search)) throw new Error(`${label} の更新対象が見つかりません`);
          html = html.replace(search, replacement);
        };

        replaceRequired(
`          <select id="pageSizeInput">
            <option value="6">6商品（1段）</option>
            <option value="12">12商品（2段）</option>
            <option value="18">18商品（3段）</option>
            <option value="24">24商品（4段）</option>
          </select>`,
`          <select id="pageSizeInput">
            <option value="1">1商品（1列×1段）</option>
            <option value="2">2商品（2列×1段）</option>
            <option value="3">3商品（2列×2段）</option>
            <option value="4">4商品（2列×2段）</option>
            <option value="6">6商品（3列×2段）</option>
            <option value="8">8商品（3列×3段）</option>
            <option value="10">10商品（3列×4段）</option>
            <option value="12">12商品（3列×4段）</option>
            <option value="16">16商品（4列×4段）</option>
            <option value="18">18商品（4列×5段）</option>
            <option value="20">20商品（4列×5段）</option>
            <option value="21">21商品（4列×6段）</option>
            <option value="24">24商品（4列×6段）</option>
          </select>`,
          "商品数設定"
        );

        replaceRequired(
          "      const CURRENT_SETTINGS_VERSION = 6;\n      const PAGE_SIZE_OPTIONS = [6, 12, 18, 24];",
          "      const CURRENT_SETTINGS_VERSION = 8;\n      const PAGE_SIZE_OPTIONS = [1, 2, 3, 4, 6, 8, 10, 12, 16, 18, 20, 21, 24];",
          "設定バージョン"
        );

        replaceRequired(
          "        if (!PAGE_SIZE_OPTIONS.includes(normalized.pageSize)) normalized.pageSize = DEFAULT_SETTINGS.pageSize;",
          "        // 旧版の15商品設定は、整った4列×4段の16商品表示へ自動移行する。\n        if (normalized.pageSize === 15) normalized.pageSize = 16;\n        if (!PAGE_SIZE_OPTIONS.includes(normalized.pageSize)) normalized.pageSize = DEFAULT_SETTINGS.pageSize;",
          "15商品設定の移行"
        );

        const layoutPattern = /      function layoutForItemCount\(count\) \{[\s\S]*?      \}\n\n      function render\(\) \{/;
        if (!layoutPattern.test(html)) throw new Error("レイアウト関数の更新対象が見つかりません");
        html = html.replace(layoutPattern,
`      function layoutForPageSize(pageSize) {
        if (innerWidth < 760) {
          return { columns: 1, rows: Math.max(1, pageSize) };
        }
        if (innerWidth < 1180) {
          const columns = pageSize === 1 ? 1 : 2;
          return { columns, rows: Math.max(1, Math.ceil(pageSize / columns)) };
        }
        const layouts = {
          1: [1, 1], 2: [2, 1], 3: [2, 2], 4: [2, 2],
          6: [3, 2], 8: [3, 3], 10: [3, 4], 12: [3, 4],
          16: [4, 4], 18: [4, 5], 20: [4, 5], 21: [4, 6], 24: [4, 6]
        };
        const [columns, rows] = layouts[pageSize] || layouts[24];
        return { columns, rows };
      }

      function applyCardFrameForLayout(layout) {
        const gridStyle = getComputedStyle(ui.grid);
        const columnGap = Number.parseFloat(gridStyle.columnGap) || 0;
        const rowGap = Number.parseFloat(gridStyle.rowGap) || 0;
        const usableWidth = Math.max(1, ui.grid.clientWidth - columnGap * (layout.columns - 1));
        const usableHeight = Math.max(1, ui.grid.clientHeight - rowGap * (layout.rows - 1));
        const columnWidth = usableWidth / layout.columns;
        const rowHeight = usableHeight / layout.rows;
        const frameWidth = columnWidth;
        const frameHeight = rowHeight;
        const imageScale = Math.max(.6, Math.min(1.4, state.settings.imageScale / 100));
        // カード境界2px + 画像枠の上下余白8pxを除いた内寸を3:4にする。
        const naturalImageColumn = Math.max(72, (rowHeight - 10) * .75 + 8);
        const minimumInfoWidth = Math.min(230, Math.max(150, frameWidth * .46));
        const maximumImageColumn = Math.max(72, frameWidth - minimumInfoWidth);
        const imageColumn = Math.min(naturalImageColumn, naturalImageColumn * imageScale, maximumImageColumn);
        const infoWidth = Math.max(1, frameWidth - imageColumn);
        const priceCap = Math.max(20, Math.min(rowHeight * .24, infoWidth / 5.4));
        const stockCap = Math.max(14, Math.min(rowHeight * .18, infoWidth * .17));
        const labelCap = Math.max(10, Math.min(rowHeight * .11, infoWidth * .1));
        const nameCap = Math.max(11, Math.min(rowHeight * .12, infoWidth * .1));
        document.documentElement.style.setProperty("--card-frame-width", frameWidth.toFixed(2) + "px");
        document.documentElement.style.setProperty("--card-frame-height", frameHeight.toFixed(2) + "px");
        document.documentElement.style.setProperty("--card-image-column", imageColumn.toFixed(2) + "px");
        document.documentElement.style.setProperty("--card-price-cap", priceCap.toFixed(2) + "px");
        document.documentElement.style.setProperty("--card-stock-cap", stockCap.toFixed(2) + "px");
        document.documentElement.style.setProperty("--card-label-cap", labelCap.toFixed(2) + "px");
        document.documentElement.style.setProperty("--card-name-cap", nameCap.toFixed(2) + "px");
      }

      function render() {`);

        replaceRequired(
          "        const layout = layoutForItemCount(visible.length);",
          "        const layout = layoutForPageSize(state.settings.pageSize);",
          "固定レイアウト呼び出し"
        );

        replaceRequired(
          "        document.documentElement.style.setProperty(\"--columns\", String(layout.columns));\n        document.documentElement.style.setProperty(\"--rows\", String(layout.rows));",
          "        document.documentElement.style.setProperty(\"--columns\", String(layout.columns));\n        document.documentElement.style.setProperty(\"--rows\", String(layout.rows));\n        ui.grid.dataset.pageSize = String(state.settings.pageSize);\n        ui.grid.dataset.layoutColumns = String(layout.columns);\n        ui.grid.dataset.layoutRows = String(layout.rows);",
          "画像比率用レイアウト属性"
        );

        replaceRequired(
          "        ui.grid.appendChild(fragment);",
          "        ui.grid.appendChild(fragment);\n        applyCardFrameForLayout(layout);",
          "商品枠の実寸調整"
        );

        replaceRequired(
          "        price.textContent = available ? formatPrice(value, displayText) : \"—\";",
          "        price.textContent = formatPrice(value, displayText);",
          "在庫0価格の表示"
        );

        replaceRequired(
`    <button class="control-button" id="fullscreenButton" type="button" aria-label="全画面表示" title="全画面表示">⛶</button>
    <button class="control-button" id="settingsButton" type="button" aria-label="設定" title="設定">⚙</button>`,
`    <button class="control-button" id="fullscreenButton" type="button" aria-label="全画面表示" title="全画面表示">⛶</button>
    <button class="control-button export-image-button" id="exportImageButton" type="button" aria-label="現在の画面をPNG保存" title="現在の画面をPNG保存">PNG</button>
    <button class="control-button" id="settingsButton" type="button" aria-label="設定" title="設定">⚙</button>`,
          "PNG保存ボタン"
        );

        html = html.replace(
          "</head>",
          `<link rel="stylesheet" href="hide-zero-stock.css?v=${VERSION}"><link rel="stylesheet" href="remaining-one.css?v=${VERSION}"><link rel="stylesheet" href="compact-price.css?v=${VERSION}"></head>`
        );
        const remainingOneScript = `<script src="remaining-one.js?v=${VERSION}"></` + `script>`;
        const html2CanvasScript = `<script src="vendor/html2canvas.min.js?v=${VERSION}"></` + `script>`;
        const screenExportScript = `<script src="screen-export.js?v=${VERSION}"></` + `script>`;
        html = html.replace("</body>", `${remainingOneScript}${html2CanvasScript}${screenExportScript}</body>`);

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.textContent = "表示データの読み込みに失敗しました。ページを再読み込みしてください。";
        console.error(error);
      }
    })();
  </script>
</body>
</html>
